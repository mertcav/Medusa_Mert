# Event stream (Kafka) cluster + client varsayılanları — WBS 1.1.8
# Sağlayıcı-nötr (ADR-002): Kafka veya bölgesel eşdeğer. SIR YOK — bootstrap/SASL/TLS yalnız ${ENV}.
# Dayanıklılık (ADR-007 "dayanıklı, kayıpsız") cluster_defaults invariant I4 ile hizalı.

# ---- Bağlantı (placeholder; deployment secret'tan) ----
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
security.protocol=${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
sasl.mechanism=${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
# sasl.jaas.config: deployment secret'tan enjekte edilir (burada YAZILMAZ)
ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION}

# ---- Broker/topic dayanıklılık varsayılanları ----
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
auto.create.topics.enable=false

# ---- Producer (idempotent + kayıpsız) ----
producer.acks=all
producer.enable.idempotence=true
producer.max.in.flight.requests.per.connection=5
producer.compression.type=zstd
producer.retries=2147483647
producer.delivery.timeout.ms=120000

# ---- Consumer (at-least-once + idempotent tüketici; manuel commit) ----
consumer.enable.auto.commit=false
consumer.isolation.level=read_committed
consumer.auto.offset.reset=earliest
consumer.max.poll.records=500

# ---- Residency ----
# Her home-region için AYRI cluster (NFR 10.7). Cross-region replikasyon YALNIZ
# agregat/redacted veri için (MirrorMaker2 ayrı whitelisted topic seti); ham PII residency-pinned.
