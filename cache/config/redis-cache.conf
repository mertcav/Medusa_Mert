# Redis — CACHE pool (semantic cache index + TTS cache index) referans konfigürasyonu
# WBS 1.1.5 · Kaynak: SAD §12.1 / §15.1 · keyspace-spec.json pool "cache"
#
# Vendor-neutral: SAD §12.1 "Cache" yeteneği için referans (Redis/Valkey/KeyDB/MemoryDB).
# Sır/credential repoya YAZILMAZ — parola yalnız ${ENV}/aclfile, TLS sertifikaları deployment'tan.

################################## AĞ / GÜVENLİK ###############################
bind 127.0.0.1 -::1
protected-mode yes
# Üretim: yalnız TLS (bkz. redis-session.conf TLS bloğu) + aclfile.
#   aclfile /etc/redis/users.acl     # bkz. config/users.acl.example

############################### BELLEK / EVICTION ##############################
maxmemory 2gb
# volatile-lru: tüm cache anahtarları TTL'li; bellek baskısında en az kullanılan
# TTL'li anahtar düşürülür. Cache miss yalnız maliyet/gecikme artışıdır (FR-RES-003/004),
# doğruluk kaybı değil — güvenle düşürülebilir.
maxmemory-policy volatile-lru

################################# KALICILIK (YOK) #############################
# Cache türetilmiş veridir; yeniden üretilebilir. Disk persistence kapalı (ephemeral).
# (İstenirse bölgesel snapshot opsiyonel — cache PII içermez, TM-I-09; residency riski düşük.)
save ""
appendonly no

################################## DAVRANIŞ ###################################
# Anahtar TTL sözleşmesi keyspace-spec.json'da: semantic 86400s, tts 2592000s.
# Anahtar bileşenleri hash'li (ham metin/PII anahtara yazılmaz; TM-I-09/SEC-15).
notify-keyspace-events ""
