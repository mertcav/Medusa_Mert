# Redis — SESSION pool (canlı oturum belleği) referans konfigürasyonu
# WBS 1.1.5 · Kaynak: SAD §12.1 / §15.1 · keyspace-spec.json pool "session"
#
# Vendor-neutral: bu, SAD §12.1 "Cache" yeteneği için referanstır (Redis/Valkey/KeyDB/MemoryDB).
# Sır/credential repoya YAZILMAZ — parola yalnız ${ENV}/aclfile, TLS sertifikaları deployment'tan.

################################## AĞ / GÜVENLİK ###############################
bind 127.0.0.1 -::1
protected-mode yes
# Üretim: TCP'yi kapatıp yalnız TLS dinle. tls-port + sertifikalar deployment'ta verilir:
#   tls-port 6380
#   port 0
#   tls-cert-file ${REDIS_TLS_CERT}
#   tls-key-file  ${REDIS_TLS_KEY}
#   tls-ca-cert-file ${REDIS_TLS_CA}
# Kimlik doğrulama: ACL dosyası ile (parola repoya yazılmaz):
#   aclfile /etc/redis/users.acl     # bkz. config/users.acl.example
# Varsayılan kullanıcı kapatılır; per-tenant/uygulama kullanıcıları en-az-yetki (SEC-15).

############################### BELLEK / EVICTION ##############################
maxmemory 4gb
# noeviction: aktif çağrının oturum durumu mid-call ASLA düşürülmez. Kapasite,
# eviction yerine admission control / backpressure ile yönetilir (FR-RES-014,
# FR-TEN-006/007). Bellek dolunca yazım OOM hata döndürür (sessiz kayıp yerine
# kontrollü ret) — runtime bunu graceful shed sinyali olarak işler.
maxmemory-policy noeviction

################################# KALICILIK (YOK) #############################
# Ephemeral: oturum belleği disk'e yazılmaz.
#  - PII disk'e düşmez (residency yüzeyi daralır; NFR 10.7)
#  - Retention = TTL ile geri döndürülemez silme (FR-REC-006/010)
save ""
appendonly no

################################## DAVRANIŞ ###################################
# Anahtar TTL sözleşmesi keyspace-spec.json'da; her oturum anahtarı TTL'li yazılır
# (idle 1800s sliding, hard cap 14400s) ve çağrı sonunda açıkça silinir.
# Lazy + active expiry default açık; aktif expiry'yi agresif tutmak için:
# hz 50
notify-keyspace-events ""
